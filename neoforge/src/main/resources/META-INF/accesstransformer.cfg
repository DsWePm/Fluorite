# FluidRenderer.fluidModels is private in vanilla. The Fabric build reaches it anyway because
# fabric-api ships fabric-transitive-access-wideners-v1, which widens it for every mod on that loader —
# so this dependency is real but invisible in the sources, and the mod declares no accesswidener of its
# own. NeoForge has no such blanket widening, hence this.
#
# RtTerrainMesher hands the model set to RtFluidMesher, which is otherwise entirely loader-neutral: the
# fluid path already goes through vanilla FluidRenderer and a VertexConsumer capture.
public net.minecraft.client.renderer.block.FluidRenderer fluidModels
