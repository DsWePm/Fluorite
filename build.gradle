import javax.inject.Inject
import org.gradle.process.ExecOperations
import io.github.dswepm.fluorite.build.GenerateShaderRecords
import io.github.dswepm.fluorite.build.GenerateEndEnvironment
import io.github.dswepm.fluorite.build.EndEnvironmentAsset
import io.github.dswepm.fluorite.build.FetchVerifiedAsset
import io.github.dswepm.fluorite.build.GenerateHighCloudAssets
import io.github.dswepm.fluorite.build.HighCloudAssets

// Root project. Owns the three build steps that are identical for every mod loader — SPIR-V
// compilation, the Slang-reflection Java record generator, and the NGX native bundle — and applies no
// loader plugin of its own. The mod jars are produced by the `fabric` and `neoforge` subprojects, which
// both compile the shared sources under common/ and consume this project's generated directories.
//
// `common/` is deliberately NOT a Gradle subproject: it is a plain source directory that each loader
// module adds via srcDir, so the shared code compiles against that loader's own Minecraft artifact
// rather than relying on the two toolchains producing binary-compatible jars.

// Compile GLSL and Slang sources to SPIR-V at build time instead of tracking binaries. Requires
// glslangValidator, slangc, and spirv-val from the Vulkan SDK or PATH.
def shaderGenRoot = layout.buildDirectory.dir("generated/shaders") // classpath root -> /fluorite/rt/*.spv

// Resolution order for each shader tool:
//   1. -P<name>Path=<file-or-dir>, or the <NAME> environment variable — pins one specific binary.
//   2. $VULKAN_SDK/Bin/<name>
//   3. PATH
//
// The override exists because the Vulkan SDK's bundled slangc lags the standalone Slang releases, and
// the world shaders need the four-parameter Ptr<T, Access, AddressSpace, Layout> form. That layout
// argument is load-bearing (see shaders/world/world_common.slang:5-10 — without it WorldPush.sunDir
// lands at offset 200 instead of the Java writer's 208 and silently reads garbage), so an older slangc
// does not merely warn, it fails to parse world_common.slang at all:
//   error 39999: too many arguments to call (got 4, expected 3)
// Vulkan SDK 1.4.341.1 ships Slang 2026.1, which is too old; CI pins SDK 1.4.350.0. Point slangcPath at
// a standalone Slang release (>= 2026.14 verified) when the local SDK's copy is behind.
def resolveVulkanTool = { String name ->
	def exe = org.gradle.internal.os.OperatingSystem.current().windows ? ".exe" : ""
	def override = findProperty("${name}Path") ?: System.getenv(name.toUpperCase(java.util.Locale.ROOT))
	if (override) {
		def overrideFile = file(override.toString())
		if (overrideFile.isDirectory()) {
			overrideFile = new File(overrideFile, "${name}${exe}")
		}
		if (!overrideFile.isFile()) {
			throw new GradleException("Configured ${name} override '${override}' is not an executable file")
		}
		return overrideFile.absolutePath
	}
	def sdk = System.getenv("VULKAN_SDK")
	if (sdk) {
		def fromSdk = file("${sdk}/Bin/${name}${exe}")
		if (fromSdk.exists()) {
			return fromSdk.absolutePath
		}
	}
	return "${name}${exe}" // fall back to PATH; exec fails with a clear message if absent
}

abstract class CompileShaders extends DefaultTask {
	@InputDirectory abstract DirectoryProperty getSrcDir()
	@OutputDirectory abstract DirectoryProperty getOutDir()
	@Input abstract Property<String> getGlslang()
	@Input abstract Property<String> getSpirvVal()
	@Input abstract Property<String> getSlangc()

	@Inject abstract ExecOperations getExecOps()

	// world.rgen.slang → "world.rgen"; world.rahit → "world.rahit" (GLSL names pass through).
	static String outBase(File src) {
		return src.name.endsWith(".slang") ? src.name.substring(0, src.name.length() - 6) : src.name
	}

	@TaskAction
	void compile() {
		def outDirFile = outDir.get().asFile
		// Slang stages are named <name>.<stage>.slang (world.rahit.slang → world.rahit.spv); module files
		// like world_common.slang match no stage glob and are picked up only via `import`.
		def stageIncludes = ["rgen", "rchit", "rahit", "rmiss", "rcall", "comp", "vert", "frag"]
				.collectMany { stage -> ["**/*.${stage}", "**/*.${stage}.slang"] }
		def validate = { File spv ->
			execOps.exec {
				commandLine spirvVal.get(), "--target-env", "vulkan1.2", spv.absolutePath
			}
		}
		def compileOne = { File src, File spv, List<String> defines ->
			execOps.exec {
				// -g (OpLine/OpSource debug info), not -gVS: the NonSemantic.Shader.DebugInfo form (-gVS)
				// emits OpExtInstWithForwardRefsKHR (SPV_KHR_relaxed_extended_instruction), which trips a
				// validation error unless the shaderRelaxedExtendedInstruction device feature is enabled.
				// -g keeps source-level debug info for Nsight/RenderDoc without needing that extension.
				commandLine([glslang.get(), "-V", "--target-env", "vulkan1.2", "-g"] + defines
						+ [src.absolutePath, "-o", spv.absolutePath])
			}
			validate(spv)
		}
		def compileOneSlang = { File src, File spv, List<String> extra ->
			execOps.exec {
				// Embed Slang source and line mappings in SPIR-V for RenderDoc/Nsight source debugging.
				// Overlay Slang stages may consume the reflected world ABI (rain streaks do); expose the
				// canonical module directory instead of duplicating a partial WorldPush definition.
				commandLine([slangc.get(), src.absolutePath, "-target", "spirv",
						"-profile", "spirv_1_5", "-matrix-layout-column-major",
						"-warnings-as-errors", "all", "-warnings-disable", "41012", "-g",
						"-I", new File(srcDir.get().asFile, "world").absolutePath] + extra
						+ ["-o", spv.absolutePath])
			}
			validate(spv)
		}
		def shaderFiles = srcDir.get().asFileTree.matching {
			include stageIncludes
		}.files.sort { it.absolutePath }
		def duplicateOutputs = shaderFiles
				.groupBy { "${outBase(it)}.spv" }
				.findAll { entry -> entry.value.size() > 1 }
		if (!duplicateOutputs.isEmpty()) {
			throw new GradleException("Duplicate shader output name(s): "
					+ duplicateOutputs.collect { entry -> "${entry.key} from ${entry.value*.path.join(', ')}" }.join("; "))
		}
		// Compile into Gradle's task-temporary directory. A compiler or validator failure leaves the last
		// successful published output intact instead of emptying build/generated/shaders halfway through.
		def scratchDir = new File(temporaryDir, "spv")
		if (scratchDir.exists() && !scratchDir.deleteDir()) {
			throw new GradleException("failed to clear shader scratch directory ${scratchDir}")
		}
		scratchDir.mkdirs()
		shaderFiles.each { src ->
			def base = outBase(src)
			def spv = new File(scratchDir, "${base}.spv")
			if (src.name.endsWith(".slang")) {
				def worldIndirectRaygen = base == "world.rgen"
				if (worldIndirectRaygen) {
					// Keep a capability-free TraceRay fallback for devices without EXT SER, and
					// publish the reordered variant separately when the extension is available.
					compileOneSlang(src, spv, [])
					compileOneSlang(src, new File(scratchDir, "world_ser.rgen.spv"),
							["-DFLUORITE_ENABLE_EXT_SER", "-capability", "spvShaderInvocationReorderEXT"])
				} else {
					// Pass A intentionally uses ordinary TraceRay.
					compileOneSlang(src, spv, [])
				}
			} else {
				compileOne(src, spv, [])
			}
		}
		outDirFile.mkdirs()
		outDirFile.listFiles().findAll { it.isFile() && it.name.endsWith(".spv") }.each { it.delete() }
		scratchDir.listFiles().findAll { it.isFile() }.each { src ->
			java.nio.file.Files.move(src.toPath(), new File(outDirFile, src.name).toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
	}
}

def compileShaders = tasks.register("compileShaders", CompileShaders) {
	group = "build"
	description = "Compiles shaders/** shader sources to SPIR-V and validates them."
	srcDir = file("shaders")
	outDir = layout.buildDirectory.dir("generated/shaders/fluorite/rt")
	glslang = resolveVulkanTool("glslangValidator")
	spirvVal = resolveVulkanTool("spirv-val")
	slangc = resolveVulkanTool("slangc")
}

def generateShaderRecords = tasks.register("generateShaderRecords", GenerateShaderRecords) {
	group = "build"
	description = "Generates typed Java shader records and serializers from Slang reflection."
	worldSourceDir = file("shaders/world")
	probeSource = file("shaders/world/world_layout_probe.slang")
	slangc = resolveVulkanTool("slangc")
	spirvVal = resolveVulkanTool("spirv-val")
	outDir = layout.buildDirectory.dir("generated/sources/shaderRecords")
}

def endEnvironmentGenRoot = layout.buildDirectory.dir("generated/end-environment")
def fetchEndHdr = tasks.register("fetchEndHdr", FetchVerifiedAsset) {
	group = "build setup"
	description = "Downloads the externally hosted End HDR source and verifies its pinned SHA-256."
	sourceUrl = EndEnvironmentAsset.SOURCE_URL
	sha256 = EndEnvironmentAsset.SHA256
	assetName = "End HDR source"
	outputFile = layout.projectDirectory.file(".gradle/fluorite-assets/${EndEnvironmentAsset.FILE_NAME}")
}

def highCloudGenRoot = layout.buildDirectory.dir("generated/high-clouds")
def fetchHighCloudPatches = tasks.register("fetchHighCloudPatches", FetchVerifiedAsset) {
	group = "build setup"
	description = "Downloads the CC0 high-cloud patch archive and verifies its pinned SHA-256."
	sourceUrl = HighCloudAssets.PATCH_SOURCE_URL
	sha256 = HighCloudAssets.PATCH_SHA256
	assetName = "high-cloud patch source"
	outputFile = layout.projectDirectory.file(".gradle/fluorite-assets/${HighCloudAssets.PATCH_FILE_NAME}")
}
def generateHighCloudAssets = tasks.register("generateHighCloudAssets", GenerateHighCloudAssets) {
	group = "build"
	description = "Builds lighting-free CC0 high-cloud optical-depth KTX2 resources."
	def configuredPatches = findProperty("highCloudPatchSource")
	if (configuredPatches != null) {
		patchZip = file(configuredPatches.toString())
	} else {
		patchZip = fetchHighCloudPatches.flatMap { it.outputFile }
		dependsOn(fetchHighCloudPatches)
	}
	outDir = highCloudGenRoot
}
def generateEndEnvironment = tasks.register("generateEndEnvironment", GenerateEndEnvironment) {
	group = "build"
	description = "Converts the licensed End HDR and generates fixed Kerr-Schild transfer/disk KTX2 assets."
	def configuredHdr = findProperty("endHdrSource")
	if (configuredHdr != null) {
		sourceHdr = file(configuredHdr.toString())
	} else {
		sourceHdr = fetchEndHdr.flatMap { it.outputFile }
		dependsOn(fetchEndHdr)
	}
	outDir = endEnvironmentGenRoot
}

def ngxNativeGenRoot = layout.buildDirectory.dir("generated/ngx-natives")
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.toLowerCase(java.util.Locale.ROOT) }
def isRunClientInvocation = requestedTaskNames.any { it == "runclient" || it.endsWith(":runclient") }
def ngxShimConfig = (findProperty("ngxShimConfig") ?: findProperty("ngxNativeConfig") ?: "release")
		.toString().toLowerCase(java.util.Locale.ROOT)
def normalizeNgxVendorConfig = { String config ->
	def normalized = config.toLowerCase(java.util.Locale.ROOT)
	if (normalized == "release") {
		return "rel"
	}
	if (normalized == "debug") {
		return "dev"
	}
	if (normalized != "rel" && normalized != "dev") {
		throw new GradleException("Unknown NGX vendor config '${config}'. Expected 'rel' or 'dev'.")
	}
	return normalized
}
def ngxVendorConfig = normalizeNgxVendorConfig(
		(findProperty("ngxVendorConfig") ?: (isRunClientInvocation ? "dev" : "rel")).toString())
def ngxNativeRoot = layout.buildDirectory.dir("native/ngx_shim").get().asFile
def ngxShimOutDir = new File(ngxNativeRoot, ngxShimConfig)
def currentNgxPlatform = {
	def os = org.gradle.internal.os.OperatingSystem.current()
	def arch = System.getProperty("os.arch", "").toLowerCase(java.util.Locale.ROOT)
	def x64 = arch == "x86_64" || arch == "amd64"
	if (os.windows && x64) {
		return "windows-x64"
	}
	if (os.linux && x64) {
		return "linux-x64"
	}
	return null
}()
def ngxNativePlatforms = [
	[
		name: "windows-x64",
		shimIncludes: [
			"ngxshim.dll"
		],
		vendorRoot: { dlssSdkRoot, vendorConfig -> new File(dlssSdkRoot, "lib/Windows_x86_64/${vendorConfig}") },
		vendorIncludes: [
			"nvngx_dlssd.dll",
			"nvngx_dlssg.dll"
		]
	],
	[
		name: "linux-x64",
		shimIncludes: [
			"libngxshim.so"
		],
		vendorRoot: { dlssSdkRoot, vendorConfig -> new File(dlssSdkRoot, "lib/Linux_x86_64/${vendorConfig}") },
		vendorIncludes: [
			"libnvidia-ngx-dlssd.so*",
			"libnvidia-ngx-dlssg.so*"
		]
	]
]
def ngxNativePlatformByName = ngxNativePlatforms.collectEntries { platform -> [(platform.name): platform] }
def requestedNgxPlatformsRaw = (findProperty("ngxPlatforms") ?: "current").toString()
		.split(",")
		.collect { it.trim() }
		.findAll { !it.isEmpty() }
def selectedNgxNativePlatforms
if (requestedNgxPlatformsRaw.size() == 1 && requestedNgxPlatformsRaw[0].equalsIgnoreCase("all")) {
	selectedNgxNativePlatforms = ngxNativePlatforms
} else if (requestedNgxPlatformsRaw.size() == 1 && requestedNgxPlatformsRaw[0].equalsIgnoreCase("current")) {
	if (currentNgxPlatform == null || !ngxNativePlatformByName.containsKey(currentNgxPlatform)) {
		throw new GradleException("No NGX native platform is configured for this host.")
	}
	selectedNgxNativePlatforms = [ngxNativePlatformByName[currentNgxPlatform]]
} else {
	def unknownPlatforms = requestedNgxPlatformsRaw.findAll { !ngxNativePlatformByName.containsKey(it) }
	if (!unknownPlatforms.empty) {
		throw new GradleException("Unknown NGX platform(s): ${unknownPlatforms.join(', ')}")
	}
	selectedNgxNativePlatforms = requestedNgxPlatformsRaw.collect { ngxNativePlatformByName[it] }
}

// DLSS SDK location. `-PdlssSdk=<dir>` (or a `dlssSdk` entry in gradle.properties) wins over the
// DLSS_SDK environment variable. The property form exists because a long-lived Gradle daemon keeps the
// environment it was started with, so a newly-exported DLSS_SDK stays invisible until the daemon is
// restarted — which surfaces as this task failing with "DLSS_SDK is not set" right after you set it.
def dlssSdkProperty = findProperty("dlssSdk")
def dlssSdkRootProvider = dlssSdkProperty != null
		? providers.provider { file(dlssSdkProperty.toString()) }
		: providers.environmentVariable("DLSS_SDK").map { file(it) }

def bundleNgxNatives = tasks.register("bundleNgxNatives") {
	group = "build"
	description = "Bundles NGX shim and ${ngxVendorConfig} DLSS native libraries into the mod resources."

	inputs.property "ngxShimConfig", ngxShimConfig
	inputs.property "ngxVendorConfig", ngxVendorConfig

	selectedNgxNativePlatforms.each { platform ->
		inputs.files(fileTree(ngxShimOutDir) {
			include platform.shimIncludes
		}).withPropertyName("ngxNatives.${platform.name}.shim")
		inputs.files(fileTree(platform.vendorRoot(dlssSdkRootProvider.getOrElse(file("__missing_dlss_sdk__")), ngxVendorConfig)) {
			include platform.vendorIncludes
		}).withPropertyName("ngxNatives.${platform.name}.vendor")
	}
	outputs.dir(ngxNativeGenRoot)
	outputs.upToDateWhen { false }

	doLast {
		delete(ngxNativeGenRoot)
		def missing = []
		def dlssSdkRoot = dlssSdkRootProvider.orNull
		if (dlssSdkRoot == null) {
			throw new GradleException("DLSS SDK location is not configured. Set -PdlssSdk=<dir>, a dlssSdk "
					+ "entry in gradle.properties, or the DLSS_SDK environment variable. If you just exported "
					+ "DLSS_SDK, run './gradlew --stop' first — the daemon caches the environment it started with.")
		}
		selectedNgxNativePlatforms.each { platform ->
			def platformShimFiles = fileTree(ngxShimOutDir) {
				include platform.shimIncludes
			}.files
			if (platformShimFiles.empty) {
				missing += "${platform.name} shim library in ${ngxShimOutDir}"
			}
		}
		selectedNgxNativePlatforms.each { platform ->
			def platformVendorRoot = platform.vendorRoot(dlssSdkRoot, ngxVendorConfig)
			def missingVendorIncludes = platform.vendorIncludes.findAll { vendorInclude ->
				fileTree(platformVendorRoot) {
					include vendorInclude
				}.files.empty
			}
			if (!missingVendorIncludes.empty) {
				missing += "${platform.name} vendor libraries ${missingVendorIncludes.join(', ')} in ${platformVendorRoot}"
			}
		}
		if (!missing.empty) {
			throw new GradleException("Missing NGX native inputs:\n - " + missing.join("\n - "))
		}

		copy {
			selectedNgxNativePlatforms.each { platform ->
				from(fileTree(ngxShimOutDir) {
					include platform.shimIncludes
				}) {
					into "fluorite/natives/${platform.name}"
				}
				from(fileTree(platform.vendorRoot(dlssSdkRoot, ngxVendorConfig))) {
					include platform.vendorIncludes
					into "fluorite/natives/${platform.name}"
				}
			}
			into ngxNativeGenRoot
		}

		// Write down what was copied. NgxRuntime needs the vendor library file names at runtime, and
		// enumerating a directory inside a mod jar is the one thing the two loaders disagree about most
		// awkwardly — Fabric hands out container root paths, and NeoForge's IModFile has no findResource
		// at all in FML 11. The build already knows the answer, so it records it and the runtime reads it
		// with getResourceAsStream, which needs no loader API on either side and works the same from a
		// jar or an exploded dev run.
		selectedNgxNativePlatforms.each { platform ->
			def platformDir = new File(ngxNativeGenRoot.get().asFile, "fluorite/natives/${platform.name}")
			def names = (platformDir.listFiles() ?: [] as File[])
					.findAll { it.isFile() && it.name != "index.txt" }
					.collect { it.name }
					.sort()
			new File(platformDir, "index.txt").setText(names.join("\n") + "\n", "UTF-8")
		}
	}
}

// Directories the loader modules wire into their own source sets. The task objects stay private to this
// project; subprojects depend on them by task path (":compileShaders" etc.) so they never reach into
// rootProject.tasks at configuration time.
ext {
	fluoriteShaderSpirvDir = shaderGenRoot
	fluoriteShaderRecordsDir = layout.buildDirectory.dir("generated/sources/shaderRecords")
	fluoriteNgxNativesDir = ngxNativeGenRoot
	fluoriteEndEnvironmentDir = endEnvironmentGenRoot
	fluoriteHighCloudDir = highCloudGenRoot
}
