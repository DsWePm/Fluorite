# The Gradle DAEMON's own JVM, which is a different thing from the toolchains the modules compile with.
#
# fabric-loom refuses to resolve on a daemon older than 21, and it refuses during CONFIGURATION -- before
# any toolchain has a say, because a plugin runs inside the daemon rather than under a compiler. So a
# per-module toolchain cannot cover this; the daemon itself has to be new enough, and that used to be
# whatever JAVA_HOME happened to point at. On a machine whose JAVA_HOME is a 17, every build worked only
# for as long as a daemon started from some earlier shell stayed alive, and broke with an error naming
# Ktx2Writer -- a file that has nothing to do with the cause.
#
# 25 rather than 21 because that is what the mod targets and what CI installs, and because neoforge's
# ModDevGradle tasks are pointed at the daemon's own java.home (see neoforge/build.gradle).
#
# If Gradle cannot find a matching JDK it now says so plainly. Point it at one on this machine with
# org.gradle.java.installations.paths in ~/.gradle/gradle.properties -- a machine-local answer to a
# machine-local question, which is why it does not belong in this file.
toolchainVersion=25
