plugins {
	id "fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
	archivesName = rootProject.archives_base_name
}

repositories {
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	mavenCentral()
}

// Shared sources live in common/ and are compiled here against Fabric's Minecraft artifact.
sourceSets {
	main {
		java.srcDir rootProject.file("common/src/main/java")
		resources.srcDir rootProject.file("common/src/main/resources")
	}
	test {
		java.srcDir rootProject.file("common/src/test/java")
	}
}

loom {
	runs {
		client {
			client()
			setConfigName("Fabric Client")
			ideConfigGenerated = true
			runDir = "../run"

			// Loads the fixed test world straight from the launch, so a digest or frameStats capture is one
			// command rather than a command plus a human clicking through the menu. The comparison only means
			// anything if both loaders open the same save at the same spawn.
			// -PbenchWorld selects a different save. Performance captures use a dedicated one that
			// tools/bench-world.sh restores from a pristine master first: Minecraft writes the
			// player position back on exit, so a world that has been played in has a camera that
			// moved, and the camera dominates trace cost far more than whatever is being measured.
			programArgs "--quickPlaySingleplayer",
					project.hasProperty("benchWorld") ? project.benchWorld : "Shader Testing Java"

			// The renderer only exists on the Vulkan backend, and options.txt defaults to "default", which
			// does not reliably resolve to Vulkan — the client then comes up on OpenGL and Fluorite silently
			// does nothing, which looks exactly like the mod being broken. Forced here so the two loaders'
			// run configs say the same thing; the NeoForge side has carried this since it was written.
			programArgs "--graphicsBackend", "VULKAN"

			// Benchmarks have to name their resolution. Without this a capture describes whatever size the
			// window happened to be — the first cost figures taken for the volumetrics work were at
			// 427x240 render / 854x480 output, while every budget in the plan is written for 1440p, and
			// nothing in the numbers said so. Opt in with:
			//   ./gradlew :fabric:runClient -PbenchWidth=2560 -PbenchHeight=1440
			if (project.hasProperty("benchWidth") && project.hasProperty("benchHeight")) {
				programArgs "--width", project.benchWidth, "--height", project.benchHeight
			}
			// Vulkan validation, opt-in:
			//   ./gradlew :fabric:runClient -PvkValidation
			// Minecraft's VulkanInstance takes a `validation` flag but nothing here can reach it, so this
			// goes through the loader instead: VK_INSTANCE_LAYERS force-enables a layer the application
			// never asked for. Off by default because it costs a large fraction of the frame and would
			// make every benchmark meaningless — but it is the right first instrument for anything that
			// smells like a destroyed-resource-still-bound bug, where the symptom on screen is whatever
			// memory got reused and says nothing about who freed it.
			//
			// Messages need somewhere to go: with no VK_EXT_debug_utils messenger created by the app, the
			// layer drops them unless a settings file redirects them, hence run/vk_layer_settings.txt.
			if (project.hasProperty("vkValidation")) {
				environmentVariable "VK_INSTANCE_LAYERS", "VK_LAYER_KHRONOS_validation"
				environmentVariable "VK_LAYER_SETTINGS_PATH",
						file("${project.rootDir}/run/vk_layer_settings.txt").absolutePath
			}

			// java.lang.foreign restricted methods (FFM bindings into the NGX shim)
			vmArg "--enable-native-access=ALL-UNNAMED"

			// NVIDIA NGX (DLSS) allocates ~1MB on the stack during init, which overflows Java's default 1MB thread stack.
			// pass -Xss here directly so the main render thread is resized before the VM parses JAVA_TOOL_OPTIONS.
			vmArg "-Xss16m"

			// NixOS fix: Gradle forks drop the dev-shell's LD_LIBRARY_PATH.
			// We manually add the driver path so NGX can successfully dlopen libnvidia-ngx.so.1.
			if (file("/run/opengl-driver/lib").exists()) {
				def inherited = System.getenv("LD_LIBRARY_PATH")
				environmentVariable "LD_LIBRARY_PATH",
						inherited ? "/run/opengl-driver/lib:${inherited}" : "/run/opengl-driver/lib"
			}
		}

		server {
			server()
			setConfigName("Fabric Server")
			ideConfigGenerated = true
			runDir = "../run"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Layered TOML config (config/fluorite.toml) — NightConfig, the same library NeoForge's
	// ModConfigSpec is built on. Jar-in-Jar'd here because Fabric ships no copy of its own.
	include implementation("com.electronwill.night-config:core:3.8.3")
	include implementation("com.electronwill.night-config:toml:3.8.3")
}

// Generated artifacts from the root project. Depended on by task path rather than by task object so
// this module never touches rootProject.tasks during configuration.
sourceSets.main.java.srcDir(files(rootProject.ext.fluoriteShaderRecordsDir).builtBy(":generateShaderRecords"))
// Emit the .spv into the main resources so they land in the jar / on the runClient classpath at the
// same /fluorite/rt/ path the loader (RtPipeline) reads.
sourceSets.main.resources.srcDir(files(rootProject.ext.fluoriteShaderSpirvDir).builtBy(":compileShaders"))
sourceSets.main.resources.srcDir(files(rootProject.ext.fluoriteNgxNativesDir).builtBy(":bundleNgxNatives"))
sourceSets.main.resources.srcDir(files(rootProject.ext.fluoriteEndEnvironmentDir).builtBy(":generateEndEnvironment"))
sourceSets.main.resources.srcDir(files(rootProject.ext.fluoriteHighCloudDir).builtBy(":generateHighCloudAssets"))

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.named("test", Test) {
	useJUnitPlatform()
}

// Classes compiled from common/ must not reference a loader. Scanning the compiled bytes rather than
// grepping imports is deliberate: Fabric's Renderer API is reached partly through interface injection,
// so a call site can depend on it with no import and no `net.fabricmc` anywhere in the source — see
// RtSectionSnapshots.getBiomeFabric, which appears in no import grep at all.
//
// The scan is necessary but not sufficient, precisely because of that case: an interface injected onto a
// *vanilla* type leaves only net/minecraft in the constant pool. The real proof is :neoforge:compileJava
// succeeding once that module compiles common/ (M3), where the Fabric API is simply not on the classpath.
// Empty, and meant to stay that way. Anything added here needs a note saying why the platform
// abstraction could not cover it.
def commonLoaderLeakAllowlist = [] as Set

def verifyCommonIsLoaderAgnostic = tasks.register("verifyCommonIsLoaderAgnostic") {
	group = "verification"
	description = "Fails if classes compiled from common/ reference net/fabricmc or net/neoforged."

	def commonJavaRoot = rootProject.file("common/src/main/java")
	def classesDir = sourceSets.main.output.classesDirs
	inputs.files(classesDir).withPropertyName("classes")
	inputs.property("allowlist", commonLoaderLeakAllowlist.toSorted())
	outputs.upToDateWhen { false }

	doLast {
		def offenders = [:].withDefault { [] as Set }
		classesDir.each { root ->
			if (!root.isDirectory()) {
				return
			}
			fileTree(root).matching { include "**/*.class" }.each { File classFile ->
				def rel = root.toPath().relativize(classFile.toPath()).toString().replace('\\', '/')
				def binaryName = rel.substring(0, rel.length() - ".class".length())
				def topLevel = binaryName.contains('$')
						? binaryName.substring(0, binaryName.indexOf('$'))
						: binaryName
				// Only classes whose source lives in common/ are in scope.
				if (!new File(commonJavaRoot, topLevel + ".java").isFile()) {
					return
				}
				if (commonLoaderLeakAllowlist.contains(topLevel)) {
					return
				}
				def bytes = classFile.bytes
				["net/fabricmc/", "net/neoforged/"].each { needle ->
					if (new String(bytes, "ISO-8859-1").contains(needle)) {
						offenders[topLevel] << needle
					}
				}
			}
		}
		if (!offenders.isEmpty()) {
			def detail = offenders.collect { name, needles -> " - ${name}: ${needles.join(', ')}" }.join("\n")
			throw new GradleException("common/ classes reference a mod loader:\n" + detail
					+ "\nMove the loader-specific part behind io.github.dswepm.fluorite.platform, or add the "
					+ "class to commonLoaderLeakAllowlist in fabric/build.gradle with a note saying why.")
		}
		logger.lifecycle("common/ is loader-agnostic ({} class(es) allowlisted)", commonLoaderLeakAllowlist.size())
	}
}

tasks.named("check").configure {
	dependsOn(verifyCommonIsLoaderAgnostic)
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

tasks.named("jar", Jar).configure {
	from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER", "THIRD_PARTY_NOTICES.md")) {
		into "META-INF"
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = rootProject.archives_base_name
			from components.java
		}
	}
}
